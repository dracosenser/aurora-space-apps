<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AURORA — 30s montage</title>
<style>
/*
  AURORA promotional montage — frame composition.

  One page renders any frame of the film deterministically: renderFrame(n)
  computes every value from the frame number, with no CSS transitions and no
  requestAnimationFrame anywhere, so a screenshot of frame n is always the same
  image. That is what makes the render restartable and the result stable.

  The palette and type scale are AURORA's own, lifted from src/index.css rather
  than chosen for the video: matte blacks, warm off-white, a desaturated cyan
  for live data and a muted amber for anything that wants attention. The
  application is deliberately not neon, and a trailer that made it neon would
  be advertising a different product.
*/
:root {
  --bg-deep: #0a0a0a;
  --bg: #101010;
  --surface: #191919;
  --surface-2: #1e1e1e;
  --surface-3: #292929;
  --border: rgba(229, 226, 218, 0.1);
  --border-strong: rgba(229, 226, 218, 0.21);
  --text-strong: #e5e2da;
  --text: #c3c0b8;
  --muted: #a5a5a0;
  --faint: #6f6f6a;
  --navy: #172638;
  --accent: #53708c;
  --accent-2: #6b89a6;
  --info-cyan: #6f93a3;
  --screen-glow: #7fae9a;
  --alert-amber: #c89248;
  --danger-red: #c2564e;
  --slate: #35444a;
  --font-sans: 'Inter', system-ui, sans-serif;
  --font-mono: 'DejaVu Sans Mono', ui-monospace, monospace;
  --font-display: 'DejaVu Serif', Georgia, serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
body { font-family: var(--font-sans); color: var(--text); -webkit-font-smoothing: antialiased; }

#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden;
  background: radial-gradient(ellipse 70% 62% at 50% 44%, #15181b 0%, #0a0b0c 58%, #000 100%); }

/* ---- the spacecraft plate, rendered by AURORA's own WebGL renderer ---- */
#plate { position: absolute; inset: 0; background: #000 center/cover no-repeat; }

/* ---- interface layer ---- */
#ui { position: absolute; inset: 0; }
.scr { position: absolute; inset: 0; display: none; }
.scr.on { display: block; }

/* ---- grade: vignette, a touch of grain, and the black bars at the ends ---- */
#grade { position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 78% 74% at 50% 48%, rgba(0,0,0,0) 36%, rgba(0,0,0,0.62) 100%); }
#grain { position: absolute; inset: -40px; pointer-events: none; opacity: .055; mix-blend-mode: overlay; }
#fade { position: absolute; inset: 0; background: #000; pointer-events: none; }

/* ---- type ---- */
#headline { position: absolute; left: 148px; right: 148px; text-align: center; }
#headline .h {
  font-family: var(--font-sans); font-weight: 700; letter-spacing: .13em;
  color: var(--text-strong); text-transform: uppercase;
  text-shadow: 0 2px 34px rgba(0,0,0,.85), 0 0 90px rgba(0,0,0,.6);
}
#headline .rule { height: 1px; background: var(--info-cyan); margin: 18px auto 0; opacity: .55; }

#caption { position: absolute; left: 50%; transform: translateX(-50%); bottom: 96px;
  max-width: 1180px; text-align: center; }
#caption .c {
  font-size: 25px; line-height: 1.5; color: var(--text); letter-spacing: .012em;
  text-shadow: 0 2px 20px rgba(0,0,0,.92), 0 0 56px rgba(0,0,0,.75);
}
#caption .vo { font-family: var(--font-mono); font-size: 11px; letter-spacing: .3em;
  color: var(--faint); text-transform: uppercase; margin-bottom: 11px; }

/* a thin progress hairline, the kind a mission console carries */
#tl { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(229,226,218,.08); }
#tlfill { height: 100%; background: var(--info-cyan); opacity: .5; }

/* ---------------------------------------------------------- panels ---- */
.panel { position: absolute; background: var(--bg); border: 1px solid var(--border);
  box-shadow: 0 30px 90px rgba(0,0,0,.6); }
.panel .hd { display: flex; align-items: baseline; gap: 14px;
  padding: 13px 20px; border-bottom: 1px solid var(--border); }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .22em;
  text-transform: uppercase; color: var(--info-cyan); }
.eyebrow.dim { color: var(--faint); }
.hd .ttl { font-size: 17px; color: var(--text-strong); letter-spacing: .01em; }
.hd .right { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--faint); }

.mono { font-family: var(--font-mono); }
.num { font-family: var(--font-mono); color: var(--text-strong); font-variant-numeric: tabular-nums; }

/* crew tiles */
.crewrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); }
.crew { background: var(--surface); padding: 16px 18px; position: relative; }
.crew .ini { font-family: var(--font-mono); font-size: 12px; letter-spacing: .2em; color: var(--info-cyan); }
.crew .nm { font-size: 16px; color: var(--text-strong); margin-top: 5px; }
.crew .rl { font-size: 12px; color: var(--faint); margin-top: 2px; line-height: 1.35; height: 32px; }
.crew .sc { display: flex; align-items: baseline; gap: 9px; margin-top: 10px; }
.crew .sc b { font-family: var(--font-mono); font-size: 30px; font-weight: 400; color: var(--text-strong); }
.crew .st { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; }
.st.nominal { color: var(--screen-glow); }
.st.caution { color: var(--alert-amber); }
.crew .bar { height: 3px; background: var(--surface-3); margin-top: 10px; }
.crew .bar i { display: block; height: 100%; background: var(--screen-glow); }
.crew.flag { background: #1d1912; }
.crew.flag .bar i { background: var(--alert-amber); }
.crew .drv { font-size: 11.5px; color: var(--muted); margin-top: 9px; line-height: 1.35; min-height: 30px; }

/* metric tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); }
.tile { background: var(--surface); padding: 14px 17px; }
.tile .k { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .18em;
  text-transform: uppercase; color: var(--faint); }
.tile .v { font-family: var(--font-mono); font-size: 27px; color: var(--text-strong); margin-top: 7px;
  font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 13px; color: var(--muted); margin-left: 4px; }
.tile .d { font-family: var(--font-mono); font-size: 11.5px; margin-top: 4px; color: var(--faint); }
.tile .d.up { color: var(--alert-amber); }
.tile .d.ok { color: var(--screen-glow); }

/* alert strip */
.alert { border: 1px solid rgba(200,146,72,.45); background: rgba(200,146,72,.07); padding: 14px 18px; }
.alert .a1 { display: flex; align-items: baseline; gap: 12px; }
.alert .sev { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .2em;
  text-transform: uppercase; color: var(--alert-amber); border: 1px solid rgba(200,146,72,.5); padding: 2px 8px; }
.alert .at { font-size: 15.5px; color: var(--text-strong); }
.alert .ab { font-size: 13px; color: var(--muted); margin-top: 8px; line-height: 1.5; }
.alert .chips { display: flex; gap: 7px; margin-top: 10px; }
.chip { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em; color: var(--info-cyan);
  border: 1px solid var(--border-strong); padding: 3px 9px; text-transform: uppercase; }

svg { display: block; }
.axis { stroke: var(--border); stroke-width: 1; }
.gl { stroke: rgba(229,226,218,.055); stroke-width: 1; }

/* the brand card */
#brand { position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; background: #000; }
#brand .word { font-family: var(--font-sans); font-weight: 200; letter-spacing: .42em;
  color: var(--text-strong); margin-left: .42em; }
#brand .tag { font-family: var(--font-mono); letter-spacing: .26em; text-transform: uppercase;
  color: var(--info-cyan); }
#brand .foot { font-family: var(--font-mono); letter-spacing: .24em; text-transform: uppercase;
  color: var(--faint); }
#brand .hair { height: 1px; background: var(--border-strong); }
</style>
</head>
<body>
<div id="stage">
  <div id="plate"></div>
  <div id="ui"></div>
  <div id="grade"></div>
  <canvas id="grain" width="500" height="300"></canvas>
  <div id="headline"><div class="h"></div><div class="rule"></div></div>
  <div id="caption"><div class="vo"></div><div class="c"></div></div>
  <div id="brand"></div>
  <div id="tl"><div id="tlfill"></div></div>
  <div id="fade"></div>
</div>
<script>
// ============================================================ timing helpers
const FPS = 30, TOTAL = 900;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
/** Smootherstep: no visible velocity change at either end. */
const ease = (x) => { x = clamp(x, 0, 1); return x * x * x * (x * (x * 6 - 15) + 10); };
const easeOut = (x) => { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); };
/** 0 before `a`, ramps to 1 over `fi`, holds, ramps down to 0 by `b`. */
function band(t, a, b, fi = 0.4, fo = 0.4) {
  if (t < a || t > b) return 0;
  return Math.min(ease((t - a) / fi), ease((b - t) / fo));
}

let DATA = null;
const $ = (s) => document.querySelector(s);

// ------------------------------------------------------------ chart drawing
/** A polyline through a series, mapped into a box, revealed up to `k`. */
function path(series, x0, y0, w, h, k = 1, lo = null, hi = null) {
  if (!series.length) return '';
  const vs = series.map((p) => p.v);
  const mn = lo ?? Math.min(...vs), mx = hi ?? Math.max(...vs);
  const span = (mx - mn) || 1;
  const n = Math.max(2, Math.round(series.length * clamp(k, 0, 1)));
  const pts = [];
  for (let i = 0; i < n; i++) {
    const x = x0 + (w * i) / (series.length - 1);
    const y = y0 + h - ((series[i].v - mn) / span) * h;
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  return 'M' + pts.join('L');
}
function areaPath(series, x0, y0, w, h, k = 1, lo = null, hi = null) {
  const p = path(series, x0, y0, w, h, k, lo, hi);
  if (!p) return '';
  const n = Math.max(2, Math.round(series.length * clamp(k, 0, 1)));
  const xEnd = x0 + (w * (n - 1)) / (series.length - 1);
  return `${p}L${xEnd.toFixed(1)},${(y0 + h).toFixed(1)}L${x0},${(y0 + h).toFixed(1)}Z`;
}
function grid(x0, y0, w, h, rows = 4) {
  let s = '';
  for (let i = 0; i <= rows; i++) {
    const y = y0 + (h * i) / rows;
    s += `<line class="gl" x1="${x0}" y1="${y}" x2="${x0 + w}" y2="${y}"/>`;
  }
  return s;
}

// ================================================================== screens
function screenVitals(t) {
  const d = DATA;
  // The trace draws on over the first second of the shot; the flag appears
  // only once the app's own status for that crew member turns to caution.
  const draw = easeOut((t - 4.15) / 1.5);
  // The crew's statuses are whatever AURORA computes for mission day 407 and
  // they do not change during the shot. An earlier cut had the tile read
  // "nominal" and flip to "caution" part way through for drama, which would
  // have been the film inventing a verdict the application never gave. What
  // animates is the interface drawing itself in — the trace, then the detected
  // event — not the engine changing its mind.
  const detail = easeOut((t - 6.6) / 1.1);
  const alertIn = band(t, 7.3, 9.2, 0.35, 0.3);
  const luca = d.crew.find((c) => c.status !== 'nominal') ?? d.crew[3];

  const tiles = [
    ['Resting heart rate', luca.today.restingHR, 'bpm', luca.baseline.restingHR, 0],
    ['Heart-rate variability', luca.today.hrv, 'ms', luca.baseline.hrv, 0],
    ['Sleep duration', luca.today.sleepDuration, 'h', luca.baseline.sleepDuration, 1],
  ].map(([k, v, u, base, dec]) => {
    const diff = v - base;
    const up = Math.abs(diff / (base || 1)) > 0.06;
    const sign = diff > 0 ? '+' : '';
    return `<div class="tile"><div class="k">${k}</div>
      <div class="v">${v.toFixed(dec)}<small>${u}</small></div>
      <div class="d ${up ? 'up' : 'ok'}" style="opacity:${detail.toFixed(2)}">${sign}${diff.toFixed(dec)} vs personal baseline</div></div>`;
  }).join('');

  const hr = d.series.restingHR;
  return `
  <div class="panel" style="left:150px; top:132px; width:1620px;">
    <div class="hd"><span class="eyebrow">Crew vitals</span>
      <span class="ttl">${d.mission.designation}</span>
      <span class="right">MISSION DAY ${d.mission.day} / ${d.mission.totalDays} · ${d.phase.toUpperCase()}</span></div>
    <div class="crewrow">
      ${d.crew.map((c) => {
        const flag = c.status !== 'nominal';
        return `<div class="crew ${flag ? 'flag' : ''}">
          <div class="ini">${c.initials} · ${c.callsign}</div>
          <div class="nm">${c.name}</div>
          <div class="rl">${c.role}</div>
          <div class="sc"><b>${c.score}</b>
            <span class="st ${c.status}">${c.status}</span></div>
          <div class="bar"><i style="width:${c.score}%"></i></div>
          <div class="drv" style="opacity:${flag ? detail.toFixed(2) : '1'}">${c.drivers[0] ?? ''}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:grid; grid-template-columns: 1fr 600px; gap:1px; background:var(--border);">
      <div style="background:var(--surface); padding:18px 20px 14px;">
        <div class="eyebrow dim">Resting heart rate · 60 days · ${luca.name}</div>
        <svg width="980" height="300" viewBox="0 0 980 300">
          ${grid(10, 14, 958, 250)}
          <path d="${areaPath(hr, 10, 14, 958, 250, draw)}" fill="rgba(111,147,163,.12)"/>
          <path d="${path(hr, 10, 14, 958, 250, draw)}" fill="none" stroke="var(--info-cyan)" stroke-width="2.4"/>
          <line class="axis" x1="10" y1="268" x2="968" y2="268"/>
          <text x="10" y="288" fill="var(--faint)" font-family="var(--font-mono)" font-size="11">DAY ${d.mission.day - 59}</text>
          <text x="968" y="288" fill="var(--faint)" font-family="var(--font-mono)" font-size="11" text-anchor="end">DAY ${d.mission.day}</text>
        </svg>
      </div>
      <div style="background:var(--surface); padding:0;">
        <div class="tiles" style="grid-template-columns:1fr;">${tiles}</div>
      </div>
    </div>
    <div style="padding:16px 20px; opacity:${alertIn.toFixed(3)};
         transform:translateY(${((1 - easeOut((t - 7.3) / 0.5)) * 14).toFixed(1)}px);">
      <div class="alert" style="box-shadow:0 0 ${(28 * Math.max(0, 1 - Math.abs(t - 7.55) / 0.85)).toFixed(0)}px rgba(200,146,72,${(0.30 * Math.max(0, 1 - Math.abs(t - 7.55) / 0.85)).toFixed(3)});">
        <div class="a1"><span class="sev">${d.anomalies[0].severity}</span>
          <span class="at">${d.anomalies[0].title}</span></div>
        <div class="ab">${d.anomalies[0].whatChanged}</div>
      </div>
    </div>
  </div>`;
}

function screenAurora(t) {
  const d = DATA;
  const open = easeOut((t - 9.25) / 1.1);
  const veil = easeOut((t - 10.9) / 1.6);
  const a = d.anomalies[0];
  const ids = Object.keys(d.crewDose);
  const colours = ['#6f93a3', '#7fae9a', '#c89248', '#6b89a6'];
  const allDose = ids.flatMap((i) => d.crewDose[i].map((p) => p.v));
  const lo = Math.min(...allDose), hi = Math.max(...allDose);

  return `
  <div class="panel" style="left:${lerp(300, 150, open).toFixed(0)}px; top:${lerp(210, 150, open).toFixed(0)}px;
       width:${lerp(1320, 1620, open).toFixed(0)}px;">
    <div class="hd">
      <span class="eyebrow">AURORA</span>
      <span class="ttl">Crew health overview</span>
      <span class="right">${d.mission.designation} · DAY ${d.mission.day} · ${d.phase.toUpperCase()}</span>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 1px 700px; background:var(--border);">
      <div style="background:var(--bg);">
        <div class="crewrow" style="grid-template-columns:repeat(2,1fr);">
          ${d.crew.map((c) => `<div class="crew ${c.status !== 'nominal' ? 'flag' : ''}">
            <div class="ini">${c.initials}</div>
            <div class="nm">${c.name}</div>
            <div class="rl">${c.role}</div>
            <div class="sc"><b>${c.score}</b><span class="st ${c.status}">${c.status}</span></div>
            <div class="bar"><i style="width:${c.score}%"></i></div>
            <div class="drv">${c.drivers[0] ?? ''}</div></div>`).join('')}
        </div>
      </div>
      <div></div>
      <div style="background:var(--surface); padding:18px 20px;">
        <div class="eyebrow">Signal Veil</div>
        <div style="font-size:14px; color:var(--muted); margin-top:8px; line-height:1.5;">
          Indicators examined together rather than one at a time.
        </div>
        <svg width="660" height="250" viewBox="0 0 660 250" style="margin-top:16px;">
          ${grid(8, 10, 644, 198, 3)}
          ${ids.map((id, i) => `<path d="${path(d.crewDose[id], 8, 10, 644, 198, veil, lo, hi)}"
             fill="none" stroke="${colours[i]}" stroke-width="${i === 0 ? 2.2 : 1.4}" opacity="${0.45 + i * 0.1}"/>`).join('')}
          <line class="axis" x1="8" y1="216" x2="652" y2="216"/>
          <text x="8" y="238" fill="var(--faint)" font-family="var(--font-mono)" font-size="11">DAILY DOSE · ALL CREW · 30 DAYS</text>
          <text x="652" y="238" fill="var(--alert-amber)" font-family="var(--font-mono)" font-size="11" text-anchor="end"
            opacity="${veil.toFixed(2)}">EVENT D${a.startDay}–${a.endDay}</text>
        </svg>
        <div style="opacity:${veil.toFixed(3)}; margin-top:6px;">
          <div class="alert">
            <div class="a1"><span class="sev">${a.severity}</span><span class="at">${a.ruleName}</span></div>
            <div class="ab">${a.why}</div>
            <div class="chips">${a.indicators.map((i) => `<span class="chip">${d.indicatorMeta[i]?.short ?? i}</span>`).join('')}
              <span class="chip">${a.astronautIds.length} crew</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

function screenBenefit(t) {
  const d = DATA;
  // Three beats, each a different part of the application.
  const beat = t < 17.5 ? 0 : t < 19.8 ? 1 : 2;
  const local = beat === 0 ? (t - 15.1) : beat === 1 ? (t - 17.5) : (t - 19.8);
  const k = easeOut(local / 1.3);
  const a = d.anomalies[0];

  if (beat === 0) {
    return `<div class="panel" style="left:160px; top:156px; width:1600px;">
      <div class="hd"><span class="eyebrow">Crew monitoring</span><span class="ttl">Individual profiles</span>
        <span class="right">DAY ${d.mission.day}</span></div>
      <div class="crewrow">
        ${d.crew.map((c, i) => `<div class="crew ${c.status !== 'nominal' ? 'flag' : ''}"
           style="opacity:${clamp((k * 4) - i * 0.6, 0, 1).toFixed(2)};">
          <div class="ini">${c.initials} · ${c.callsign}</div>
          <div class="nm">${c.name}</div>
          <div class="rl">${c.role}</div>
          <div class="sc"><b>${c.score}</b><span class="st ${c.status}">${c.status}</span></div>
          <div class="bar"><i style="width:${(c.score * k).toFixed(0)}%"></i></div>
          <div class="drv">${c.drivers.join(' · ')}</div></div>`).join('')}
      </div>
      <div style="background:var(--surface); padding:16px 20px; border-top:1px solid var(--border);">
        <svg width="1556" height="250" viewBox="0 0 1556 250">
          ${grid(8, 8, 1540, 206, 3)}
          ${Object.keys(d.crewSeries).map((id, i) => `<path
            d="${path(d.crewSeries[id], 8, 8, 1540, 206, k)}" fill="none"
            stroke="${['#6f93a3', '#7fae9a', '#6b89a6', '#c89248'][i]}" stroke-width="1.6" opacity=".8"/>`).join('')}
          <text x="8" y="240" fill="var(--faint)" font-family="var(--font-mono)" font-size="12">RESTING HEART RATE · ALL CREW · 42 DAYS</text>
        </svg>
      </div></div>`;
  }
  if (beat === 1) {
    return `<div class="panel" style="left:160px; top:170px; width:1600px;">
      <div class="hd"><span class="eyebrow">Signal Veil</span><span class="ttl">${a.ruleName}</span>
        <span class="right">DAYS ${a.startDay}–${a.endDay} · ${a.severity.toUpperCase()}</span></div>
      <div style="background:var(--surface); padding:20px 24px;">
        <div style="font-size:17px; color:var(--text-strong); line-height:1.45;">${a.title}</div>
        <div style="font-size:14px; color:var(--muted); margin-top:12px; line-height:1.6; max-width:1180px;
             opacity:${clamp(k * 1.6 - 0.2, 0, 1).toFixed(2)};">${a.whatChanged}</div>
        <svg width="1550" height="300" viewBox="0 0 1550 300" style="margin-top:18px;">
          ${grid(8, 8, 1534, 256, 3)}
          ${Object.keys(d.crewDose).map((id, i) => `<path
            d="${path(d.crewDose[id], 8, 8, 1534, 256, k)}" fill="none"
            stroke="${['#6f93a3', '#7fae9a', '#6b89a6', '#c89248'][i]}" stroke-width="1.7" opacity=".85"/>`).join('')}
          <text x="8" y="290" fill="var(--faint)" font-family="var(--font-mono)" font-size="12">DAILY DOSE · mSv · ALL CREW</text>
        </svg>
        <div class="chips" style="margin-top:14px;">
          ${a.indicators.map((i) => `<span class="chip">${d.indicatorMeta[i]?.label ?? i}</span>`).join('')}
          <span class="chip">${a.astronautIds.length} crew affected</span>
        </div>
      </div></div>`;
  }
  return `<div class="panel" style="left:160px; top:170px; width:1600px;">
    <div class="hd"><span class="eyebrow">Constellation engine</span>
      <span class="ttl">Status and drivers</span><span class="right">DAY ${d.mission.day}</span></div>
    <div style="display:grid; grid-template-columns:1fr 1px 620px; background:var(--border);">
      <div style="background:var(--surface); padding:18px 22px;">
        ${d.crew.map((c, i) => `<div style="display:flex; align-items:baseline; gap:16px; padding:11px 0;
            border-bottom:1px solid var(--border); opacity:${clamp(k * 3 - i * 0.5, 0, 1).toFixed(2)};">
          <span class="mono" style="font-size:12px; letter-spacing:.18em; color:var(--info-cyan); width:62px;">${c.initials}</span>
          <span style="font-size:15px; color:var(--text-strong); width:190px;">${c.name}</span>
          <span class="num" style="font-size:20px; width:56px;">${c.score}</span>
          <span class="st ${c.status}" style="width:88px;">${c.status}</span>
          <span style="font-size:12.5px; color:var(--muted); flex:1;">${c.drivers[0] ?? ''}</span>
        </div>`).join('')}
      </div>
      <div></div>
      <div style="background:var(--bg); padding:18px 22px;">
        <div class="eyebrow dim">Mission scenario simulator</div>
        <div style="font-size:13.5px; color:var(--muted); margin-top:10px; line-height:1.55;">
          Mission conditions varied to show how exposure and countermeasures move the crew's indicators.
        </div>
        <svg width="574" height="250" viewBox="0 0 574 250" style="margin-top:16px;">
          ${grid(6, 6, 562, 206, 3)}
          <path d="${path(d.series.radiationDaily, 6, 6, 562, 206, k)}" fill="none" stroke="var(--alert-amber)" stroke-width="1.8"/>
          <path d="${path(d.series.stress, 6, 6, 562, 206, clamp(k * 1.2, 0, 1))}" fill="none" stroke="var(--info-cyan)" stroke-width="1.5" opacity=".75"/>
          <text x="6" y="240" fill="var(--faint)" font-family="var(--font-mono)" font-size="11">SIMULATED EXPOSURE vs CREW STRESS</text>
        </svg>
      </div>
    </div></div>`;
}

/** The payoff strip: compact, laid over the spacecraft rather than replacing it. */
function screenOverview(t) {
  const d = DATA;
  const k = easeOut((t - 23.1) / 1.4);
  const a = d.anomalies[0];
  return `<div class="panel" style="left:150px; right:150px; width:1620px; bottom:116px; top:auto;
       background:rgba(16,16,16,.93); opacity:${k.toFixed(3)};">
    <div class="hd"><span class="eyebrow">Mission health overview</span>
      <span class="ttl">${d.mission.designation}</span>
      <span class="right">DAY ${d.mission.day} / ${d.mission.totalDays} · ${d.phase.toUpperCase()}</span></div>
    <div style="display:grid; grid-template-columns:repeat(4,1fr) 1px 560px; background:var(--border);">
      ${d.crew.map((c) => `<div style="background:var(--surface); padding:13px 17px;">
        <div class="ini mono" style="font-size:11px; letter-spacing:.2em; color:var(--info-cyan);">${c.initials}</div>
        <div style="font-size:14.5px; color:var(--text-strong); margin-top:4px;">${c.name}</div>
        <div class="sc" style="display:flex; align-items:baseline; gap:9px; margin-top:7px;">
          <b class="num" style="font-size:25px;">${c.score}</b>
          <span class="st ${c.status}">${c.status}</span></div>
      </div>`).join('')}
      <div></div>
      <div style="background:var(--bg); padding:13px 18px;">
        <div style="display:flex; align-items:baseline; gap:11px;">
          <span class="sev mono" style="font-size:10px; letter-spacing:.2em; text-transform:uppercase;
            color:var(--alert-amber); border:1px solid rgba(200,146,72,.5); padding:2px 8px;">monitored</span>
          <span style="font-size:14px; color:var(--text-strong);">${a.ruleName}</span>
        </div>
        <div style="font-size:12.5px; color:var(--muted); margin-top:7px; line-height:1.45;">
          Days ${a.startDay}–${a.endDay} · ${a.indicators.length} indicators · ${a.astronautIds.length} crew · tracked, not resolved
        </div>
      </div>
    </div></div>`;
}

// ================================================================= the film
const HEADLINES = [
  { a: 1.05, b: 3.75, text: 'Space is unforgiving.', size: 70, y: 252 },
  { a: 5.00, b: 8.80, text: 'One signal can tell part of the story.', size: 52, y: 820 },
  { a: 9.55, b: 12.40, text: 'Meet AURORA.', size: 66, y: 806 },
  { a: 15.25, b: 17.35, text: 'Monitor crew health.', size: 46, y: 846 },
  { a: 17.60, b: 19.70, text: 'Identify developing patterns.', size: 46, y: 846 },
  { a: 19.95, b: 22.00, text: 'Support informed decisions.', size: 46, y: 846 },
];

const CAPTIONS = [
  { a: 0.70, b: 3.90, text: 'Far from Earth, even the smallest change matters.' },
  { a: 4.35, b: 8.85, text: 'But astronaut health is more than a single measurement.' },
  { a: 9.35, b: 14.75, text: 'AURORA brings health signals together, helping mission teams recognise patterns that might otherwise go unnoticed.' },
  { a: 15.20, b: 21.90, text: 'From continuous monitoring to connected insights and mission simulations, AURORA helps teams stay informed and prepared.' },
  { a: 22.35, b: 26.85, text: 'Because protecting the crew means understanding the signals before they become bigger problems.' },
];

/** Which spacecraft plate, if any, backs this frame. */
function plateFor(n) {
  const SHOTS = [[0, 119], [660, 809]];
  for (const [a, b] of SHOTS) {
    if (n >= a && n <= b) return { i: n, o: 1 };
    // Hold the last frame of a shot and fade it out under the incoming
    // interface, and fade the first frame in under the outgoing one.
    if (n > b && n <= b + 20) return { i: b, o: 1 - ease((n - b) / 20) };
    if (n < a && n >= a - 14) return { i: a, o: ease((n - (a - 14)) / 14) };
  }
  return null;
}

window.renderFrame = function (n) {
  const t = n / FPS;
  const stage = $('#stage');

  // ---- spacecraft plate, with a slow push so even a held plate breathes
  const p = plateFor(n);
  const plate = $('#plate');
  if (p === null) {
    plate.style.backgroundImage = 'none';
    plate.style.opacity = '0';
  } else {
    plate.style.opacity = p.o.toFixed(3);
    plate.style.backgroundImage = `url(plates/${String(p.i).padStart(4, '0')}.jpg)`;
    // A gentle continuous scale on top of the rendered camera move: it hides
    // the seam between shots and keeps the frame alive.
    const push = 1.045 + 0.028 * Math.sin((n / 110) * Math.PI);
    const drift = 7 * Math.sin((n / 150) * Math.PI);
    plate.style.transform = `scale(${push.toFixed(4)}) translate(${drift.toFixed(1)}px, ${(drift * 0.35).toFixed(1)}px)`;
  }

  // ---- interface
  let html = '';
  if (t >= 4.05 && t < 9.25) html = screenVitals(t);
  else if (t >= 9.25 && t < 15.05) html = screenAurora(t);
  else if (t >= 15.05 && t < 22.05) html = screenBenefit(t);
  else if (t >= 22.95 && t < 27.0) html = screenOverview(t);
  $('#ui').innerHTML = html;

  // UI fades up out of the plate and back down into it.
  const uiIn = band(t, 4.05, 22.05, 0.45, 0.45);
  const uiOut = band(t, 22.95, 27.0, 0.6, 0.5);

  // Cross-dissolve rather than cut between the three benefit beats. A hard
  // switch at 17.5 and 19.8 was the only place in the film that jumped.
  let beatDip = 1;
  for (const edge of [17.50, 19.80]) {
    const d = Math.abs(t - edge);
    if (d < 0.26) beatDip = Math.min(beatDip, ease(d / 0.26));
  }

  const ui = $('#ui');
  ui.style.opacity = String((Math.max(uiIn, uiOut) * beatDip).toFixed(3));

  // The push: each screen opens slightly wide and closes slightly in, which
  // reads as a camera settling rather than as a page loading.
  let seg = null;
  if (t >= 4.05 && t < 9.25) seg = [4.05, 9.25];
  else if (t >= 9.25 && t < 15.05) seg = [9.25, 15.05];
  else if (t >= 15.05 && t < 17.50) seg = [15.05, 17.50];
  else if (t >= 17.50 && t < 19.80) seg = [17.50, 19.80];
  else if (t >= 19.80 && t < 22.05) seg = [19.80, 22.05];
  else if (t >= 22.95 && t < 27.0) seg = [22.95, 27.0];
  if (seg) {
    const k = clamp((t - seg[0]) / (seg[1] - seg[0]), 0, 1);
    const sc = lerp(1.014, 1.0, easeOut(k));
    const ty = lerp(10, 0, easeOut(k));
    ui.style.transform = `scale(${sc.toFixed(4)}) translateY(${ty.toFixed(1)}px)`;
  } else {
    ui.style.transform = 'none';
  }

  // ---- headline
  const hl = HEADLINES.find((h) => t >= h.a - 0.4 && t <= h.b + 0.4);
  const hEl = $('#headline'), hTx = hEl.querySelector('.h'), hRu = hEl.querySelector('.rule');
  if (hl) {
    const k = band(t, hl.a, hl.b, 0.5, 0.45);
    hEl.style.opacity = k.toFixed(3);
    hEl.style.top = hl.y + 'px';
    hTx.style.fontSize = hl.size + 'px';
    hTx.textContent = hl.text.toUpperCase();
    // A few pixels of rise as it appears: motion the eye reads as intent.
    hEl.style.transform = `translateY(${(1 - ease((t - hl.a) / 0.5)) * 16}px)`;
    hRu.style.width = `${(ease((t - hl.a) / 0.9) * Math.min(540, hl.text.length * 15)).toFixed(0)}px`;
  } else {
    hEl.style.opacity = '0';
  }

  // ---- caption (the spoken line, carried on screen)
  const cp = CAPTIONS.find((c) => t >= c.a - 0.3 && t <= c.b + 0.3);
  const cEl = $('#caption');
  if (cp) {
    const k = band(t, cp.a, cp.b, 0.42, 0.42);
    cEl.style.opacity = k.toFixed(3);
    cEl.querySelector('.c').textContent = cp.text;
    cEl.querySelector('.vo').textContent = 'Narration';
    // Keep the narration clear of whatever panel is on screen.
    cEl.style.bottom = (t >= 4.05 && t < 22.05) ? '42px'
      : (t >= 22.95 && t < 27.0) ? '366px' : '96px';
  } else {
    cEl.style.opacity = '0';
  }

  // ---- brand card
  const bEl = $('#brand');
  if (t >= 26.95) {
    const k = ease((t - 27.05) / 0.85);
    const k2 = ease((t - 27.6) / 0.9);
    const k3 = ease((t - 28.1) / 0.9);
    bEl.style.opacity = String(Math.min(1, (t - 26.95) / 0.22).toFixed(3));
    bEl.innerHTML = `
      <div class="word" style="font-size:${lerp(92, 104, k).toFixed(1)}px;
           opacity:${k.toFixed(3)}; letter-spacing:${lerp(0.52, 0.42, k).toFixed(3)}em;">AURORA</div>
      <div class="hair" style="width:${(k2 * 620).toFixed(0)}px; margin:30px 0 26px;"></div>
      <div class="tag" style="font-size:22px; opacity:${k2.toFixed(3)};">
        See the signals. Protect the crew. Support the mission.</div>
      <div class="foot" style="color:var(--muted); font-size:15px; opacity:${k3.toFixed(3)}; margin-top:40px;">
        NASA Space Apps Challenge 2026</div>`;
  } else {
    bEl.style.opacity = '0';
    bEl.innerHTML = '';
  }

  // ---- the mission hairline along the bottom
  // The vignette closes a little through the problem section and opens again
  // at the reveal: the frame tightens while the tension builds, then releases.
  const tight = band(t, 5.6, 9.3, 2.6, 0.5);
  $('#grade').style.background =
    `radial-gradient(ellipse ${(78 - tight * 16).toFixed(1)}% ${(74 - tight * 15).toFixed(1)}% at 50% 48%,` +
    ` rgba(0,0,0,0) ${(36 - tight * 10).toFixed(0)}%, rgba(0,0,0,${(0.62 + tight * 0.2).toFixed(2)}) 100%)`;

  $('#tlfill').style.width = `${((n / TOTAL) * 100).toFixed(2)}%`;
  $('#tl').style.opacity = (t > 26.9 || t < 0.6) ? '0' : '0.85';

  // ---- fades: up from black at the head, a dip at the brand cut, out at the tail
  let f = 0;
  if (t < 1.40) f = 1 - ease(t / 1.40);                 // open from black
  if (t > 26.62 && t < 27.05) f = ease((t - 26.62) / 0.40);  // dip into the reveal
  if (t >= 27.05 && t < 27.22) f = 1 - ease((t - 27.05) / 0.17);
  if (t > 29.70) f = ease((t - 29.70) / 0.30);          // out at the tail
  $('#fade').style.opacity = f.toFixed(3);

  stage.dataset.frame = String(n);
};

// ---- a fixed grain field, drawn once; it must not change between frames or
// the encoder spends its bitrate on noise instead of on the picture.
(function grain() {
  const c = $('#grain'), x = c.getContext('2d');
  const img = x.createImageData(c.width, c.height);
  let s = 12345;
  for (let i = 0; i < img.data.length; i += 4) {
    s = (s * 1103515245 + 12345) & 0x7fffffff;
    const v = 110 + (s % 90);
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  c.style.width = '2000px';
  c.style.height = '1160px';
})();

fetch('data.json').then((r) => r.json()).then((d) => {
  DATA = d;
  window.DATA_READY = true;
  window.renderFrame(0);
});
</script>
