<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101010" />
    <meta
      name="description"
      content="AURORA - Astronaut health intelligence platform for long-duration space missions. NASA Space Apps Challenge 2026."
    />
    <title>AURORA | Astronaut Health Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..600;1,6..72,200..500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Paint the deep-space field before the bundle resolves, so the first
         frame is never a white flash. */
      html { background: #101010; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #101010;
        color: #6f6f6a;
        font: 600 10px/1 'IBM Plex Sans', system-ui, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        transition: opacity 0.5s ease;
      }
      #root:not(:empty) + #boot { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot">Loading archive</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
